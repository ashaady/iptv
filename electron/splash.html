<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Fluxa IPTV - Démarrage</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #090b0f;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 420px;
      padding: 32px;
    }
    .logo-container {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 24px;
    }
    .logo-glow {
      position: absolute;
      inset: -12px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.45) 0%, rgba(9, 11, 15, 0) 70%);
      border-radius: 50%;
      animation: pulse 2.5s infinite ease-in-out;
    }
    .logo {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      animation: float 3s ease-in-out infinite;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.status {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 28px;
      height: 20px;
      transition: opacity 0.3s;
    }
    .progress-track {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 9999px;
      position: absolute;
      animation: indeterminate 1.8s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes indeterminate {
      0% { left: -40%; width: 30%; }
      50% { left: 40%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <div class="logo-glow"></div>
      <img class="logo" src="../public/fluxa.png" alt="Fluxa IPTV Logo" />
    </div>
    <h1>Fluxa IPTV</h1>
    <p class="status" id="status-text">Initialisation des services...</p>
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
  </div>
</body>
</html>
