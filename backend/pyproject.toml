[project]
name = "fluxa-backend"
version = "1.0.0"
description = "Fluxa IPTV API backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.116,<1",
    "fastapi-cli>=0.0.5",
    "uvicorn[standard]>=0.35,<1",
    "httpx>=0.28,<1",
    "cryptography>=45,<47",
    "pydantic-settings>=2.10,<3",
]

[tool.fastapi]
entrypoint = "main:app"
